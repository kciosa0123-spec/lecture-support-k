<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>近大・講義支援ダッシュボード</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1200px; margin: 0 auto; padding: 20px; background: #f4f7f6; line-height: 1.6; }
    .box { background: #fff; padding: 15px; border: 1px solid #ddd; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .timetable-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
    .day-column { background: #e3f2fd; padding: 15px; border-radius: 8px; border: 1px solid #bbdefb; }
    .day-title { font-weight: bold; text-align: center; margin-bottom: 15px; color: #1565c0; border-bottom: 2px solid #90caf9; padding-bottom: 5px; }
    .period-slot { margin-bottom: 12px; min-height: 45px; }
    .period-label { font-size: 10px; color: #888; margin-bottom: 2px; }
    .empty-slot { border: 1px dashed #ccc; border-radius: 6px; height: 40px; display: flex; align-items: center; justify-content: center; color: #bbb; font-size: 11px; }
    .subject-btn { width: 100%; background: #fff; color: #333; border: 1px solid #bbb; padding: 8px; border-radius: 6px; text-align: left; font-size: 12px; cursor: pointer; transition: 0.2s; font-weight: bold; }
    .subject-btn:hover { background: #f0f0f0; border-color: #4285f4; }
    .subject-btn.active { background: #4285f4; color: #fff; border-color: #4285f4; }
    .session-grid-mini { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-top: 8px; padding: 8px; background: rgba(255,255,255,0.7); border-radius: 6px; border: 1px solid #dee2e6; display: none; }
    .session-btn { background: #eee; border: 1px solid #ccc; font-size: 10px; padding: 5px 0; border-radius: 4px; cursor: pointer; color: #666; font-weight: bold; }
    .session-btn.has-data { background: #34a853; color: #fff; border-color: #2d8a47; }
    .session-btn.selected { outline: 3px solid #ffc107; z-index: 1; }
    .search-area { background: #e8eaf6; border: 1px solid #c5cae9; }
    #search-results-table { width: 100%; border-collapse: collapse; font-size: 12px; background: white; margin-top: 10px; }
    #search-results-table th { background: #3f51b5; color: white; padding: 8px; }
    #search-results-table td { padding: 8px; border-bottom: 1px solid #eee; }
    .question-card { background: white; border: 1px solid #ddd; border-left: 4px solid #4285f4; padding: 12px; margin-bottom: 10px; border-radius: 6px; position: relative; }
    .question-card.answered { border-left-color: #ccc; opacity: 0.6; background: #f9f9f9; }
    #questions-container.hide-answered .answered { display: none; }
    button { color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    .btn-blue { background: #4285f4; }
    .btn-warning { background: #ffc107; color: #333; }
    .btn-danger { background: #dc3545; }
    .btn-success { background: #28a745; }
    .btn-secondary { background: #6c757d; }
    .btn-outline { background: #fff; color: #666; border: 1px solid #ccc; padding: 4px 10px; font-weight: normal; font-size: 11px; }
    .btn-outline.active { background: #666; color: #fff; border-color: #666; }
    .hidden { display: none; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid #eee; }
    .q-header { font-size:12px; color:#666; display:flex; justify-content:space-between; align-items:center; }
    .q-body { font-weight:bold; margin-top:5px; white-space:pre-wrap; }
    .q-toggle { padding:2px 8px; font-size:11px; border-radius:4px; border:none; cursor:pointer; }
    .q-toggle.read { background:#ccc; color:#fff; }
    .q-toggle.unread { background:#ffc107; color:#333; }
  </style>
</head>
<body>

  <h2 style="color: #c00;">Kindai University 講義支援ツール</h2>

  <div id="login-section" class="box" style="text-align: center; padding: 40px;">
    <button id="login-btn" type="button" class="btn-blue" style="font-size: 18px;">Googleでログイン</button>
  </div>

  <div id="dashboard-section" class="hidden">
    <div class="box search-area">
      <div style="display: flex; gap: 10px; align-items: center;">
        <span style="font-weight: bold; font-size: 14px;">🗂️ 全履歴検索:</span>
        <input type="text" id="global-search-input" placeholder="学籍番号、氏名、内容で検索..." style="flex:1; padding: 8px; border-radius: 5px; border: 1px solid #ccc;">
        <button id="global-search-btn" class="btn-blue">検索</button>
        <button id="clear-search-btn" class="btn-secondary" style="padding: 8px 12px;">クリア</button>
      </div>
      <div id="search-results-area" class="hidden" style="max-height: 300px; overflow-y: auto; margin-top: 15px; border-top: 1px solid #3f51b5;">
        <table id="search-results-table">
          <thead><tr><th>講義</th><th>タイプ</th><th>対象</th><th>内容</th></tr></thead>
          <tbody id="search-results-body"></tbody>
        </table>
      </div>
    </div>

    <div class="timetable-grid">
      <div class="day-column"><div class="day-title">水曜日</div><div id="subjects-wed"></div></div>
      <div class="day-column"><div class="day-title">木曜日</div><div id="subjects-thu"></div></div>
    </div>

    <div class="box" id="active-panel" style="border-top: 5px solid #c00;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div><span style="font-size: 11px; color: #666;">選択中:</span><h3 id="current-display-label" style="margin: 0;">科目を選択してください</h3></div>
        <div id="data-actions" class="hidden">
          <button id="export-csv-btn" class="btn-success">CSV出力</button>
          <button id="delete-btn" class="btn-danger" style="margin-left:10px;">回を削除</button>
        </div>
        <div id="start-actions">
          <button id="start-lecture-btn" class="btn-warning">この回で講義を開始</button>
          <button id="end-lecture-btn" class="btn-danger hidden">講義を終了</button>
        </div>
      </div>
    </div>

    <div class="box">
      <div style="display: flex; justify-content: space-between; margin-bottom: 10px; align-items: center;">
        <div style="display: flex; align-items: center; gap: 15px;">
          <span style="font-weight: bold;">出席: <span id="att-count" style="color:#28a745; font-size:1.4em;">0</span> 名</span>
          <div style="display: flex; gap: 5px;">
            <button id="filter-all-btn" class="btn-outline active">すべて</button>
            <button id="filter-unanswered-btn" class="btn-outline">未回答のみ</button>
          </div>
        </div>
        <button id="toggle-list-btn" class="btn-secondary" style="padding: 4px 12px; font-size: 11px;">名簿表示</button>
      </div>
      <div id="att-list-container" class="hidden">
        <table>
          <thead><tr><th>学籍番号</th><th>氏名</th><th>時刻</th></tr></thead>
          <tbody id="att-list-body"></tbody>
        </table>
      </div>
      <hr>
      <div id="questions-container"></div>
    </div>

    <div style="text-align: right; margin-top: 20px;">
      <span id="user-info" style="font-size: 11px; color: #999; margin-right: 10px;"></span>
      <button id="logout-btn" class="btn-secondary" style="font-size: 11px; padding: 4px 10px;">ログアウト</button>
    </div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
  import { getDatabase, ref, set, get, onValue, update, remove, off } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyClWAd9abHRIb6-mHDqU8df-r2zTXkC4Dc",
    authDomain: "lecture-support-kindai.firebaseapp.com",
    databaseURL: "https://lecture-support-kindai-default-rtdb.firebaseio.com",
    projectId: "lecture-support-kindai",
    storageBucket: "lecture-support-kindai.firebasestorage.app",
    messagingSenderId: "1009012365626",
    appId: "1:1009012365626:web:13156cb27fd5d3a3ed1803"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);
  const provider = new GoogleAuthProvider();
  provider.setCustomParameters({ prompt: 'select_account' });

  const ADMINS = ["0499b1@waka.kindai.ac.jp", "ng_osada@nara.kindai.ac.jp"];
  const LECTURE_DURATION_MS = 110 * 60 * 1000; // 自動終了までの時間（110分）
  const timetable = {
    wed: { 2: "理系英語１", 3: "理系英語１", 4: "理系英語１" },
    thu: { 1: "英語３", 3: "英語３", 4: "英語３" }
  };

  let viewingSessionId = "";
  let activeSessionId = "";

  Object.keys(timetable).forEach(day => {
    const container = document.getElementById(`subjects-${day}`);
    for (let p = 1; p <= 4; p++) {
      const slot = document.createElement('div');
      slot.className = 'period-slot';
      const label = document.createElement('div'); label.className = 'period-label'; label.textContent = `${p}限目`;
      slot.appendChild(label);
      if (timetable[day][p]) {
        const sub = timetable[day][p];
        const btn = document.createElement('button'); btn.className = 'subject-btn'; btn.textContent = sub;
        btn.onclick = () => window.toggleSubject(btn, day, sub, p);
        const grid = document.createElement('div'); grid.className = 'session-grid-mini'; grid.id = `grid-${day}-${p}`;
        for (let i = 1; i <= 15; i++) {
          const b = document.createElement('button'); b.className = 'session-btn'; b.textContent = i; b.id = `btn-${day}-${p}-${i}`;
          b.onclick = (e) => { e.stopPropagation(); window.loadSession(day, sub, p, i); };
          grid.appendChild(b);
        }
        slot.appendChild(btn); slot.appendChild(grid);
      } else {
        const empty = document.createElement('div'); empty.className = 'empty-slot'; empty.textContent = "なし";
        slot.appendChild(empty);
      }
      container.appendChild(slot);
    }
  });

  window.toggleSubject = (btn, day, sub, p) => {
    const targetGrid = document.getElementById(`grid-${day}-${p}`);
    const isAlreadyOpen = targetGrid.style.display === 'grid';
    document.querySelectorAll('.session-grid-mini').forEach(el => el.style.display = 'none');
    document.querySelectorAll('.subject-btn').forEach(el => el.classList.remove('active'));
    if (!isAlreadyOpen) { targetGrid.style.display = 'grid'; btn.classList.add('active'); scanDataPresence(day, sub, p); }
  };

  async function scanDataPresence(day, sub, p) {
    const snap = await get(ref(db, 'attendance'));
    const allAtt = snap.val() || {};
    const dName = { wed: "水", thu: "木" }[day];
    for (let i = 1; i <= 15; i++) {
      const found = Object.keys(allAtt).find(id => id.includes(`${dName}${p}`) && id.includes(sub) && id.includes(`第${i}回`));
      const btn = document.getElementById(`btn-${day}-${p}-${i}`);
      if (found) { btn.classList.add('has-data'); btn.dataset.actualId = found; }
    }
  }

  function updateStartButtonState() {
    const btn = document.getElementById('start-lecture-btn');
    if (!viewingSessionId) return;
    if (viewingSessionId === activeSessionId) {
      btn.textContent = "講義中";
      btn.className = "btn-success";
    } else {
      const sBtn = document.querySelector('.session-btn.selected');
      if (sBtn && sBtn.classList.contains('has-data')) {
        btn.textContent = "再開/更新";
        btn.className = "btn-success";
      } else {
        btn.textContent = "この回で講義を開始";
        btn.className = "btn-warning";
      }
    }
  }

  window.loadSession = (day, sub, p, num) => {
    const btn = document.getElementById(`btn-${day}-${p}-${num}`);
    const dName = { wed: "水", thu: "木" }[day];
    const now = new Date();
    const dStr = now.toISOString().slice(0, 10).replace(/-/g, "");
    const id = btn.dataset.actualId || `${dStr}_${dName}${p}${sub}第${num}回`;
    viewingSessionId = id;

    let dLabel = "";
    const m = id.match(/^(\d{4})(\d{2})(\d{2})_/);
    if (m) dLabel = ` (${parseInt(m[2])}月${parseInt(m[3])}日)`;
    else dLabel = ` (${now.getMonth() + 1}月${now.getDate()}日)`;

    document.querySelectorAll('.session-btn').forEach(el => el.classList.remove('selected'));
    btn.classList.add('selected');
    document.getElementById('current-display-label').textContent = `${dName}曜${p}限：${sub} 【第${num}回】${dLabel}`;
    document.getElementById('data-actions').classList.toggle('hidden', !btn.classList.contains('has-data'));
    updateStartButtonState();

    off(ref(db, `attendance/${viewingSessionId}`));
    off(ref(db, `questions/${viewingSessionId}`));
    startMonitoring(id);
  };

  document.getElementById('filter-all-btn').onclick = function () {
    document.getElementById('questions-container').classList.remove('hide-answered');
    this.classList.add('active'); document.getElementById('filter-unanswered-btn').classList.remove('active');
  };
  document.getElementById('filter-unanswered-btn').onclick = function () {
    document.getElementById('questions-container').classList.add('hide-answered');
    this.classList.add('active'); document.getElementById('filter-all-btn').classList.remove('active');
  };

  onAuthStateChanged(auth, (u) => {
    if (u && u.email && ADMINS.includes(u.email.toLowerCase())) {
      document.getElementById('login-section').classList.add('hidden');
      document.getElementById('dashboard-section').classList.remove('hidden');
      document.getElementById('user-info').textContent = u.email;
      onValue(ref(db, 'active_session'), async (s) => {
        const v = s.val();
        // 期限切れの自動クリーンアップ
        if (v && v.expiresAt && Date.now() > v.expiresAt) {
          console.log("期限切れの講義を自動終了します:", v.id);
          await remove(ref(db, 'active_session'));
          return;
        }
        activeSessionId = (v && v.isOpen) ? v.id : "";
        document.getElementById('end-lecture-btn').classList.toggle('hidden', !activeSessionId);
        updateStartButtonState();
      });
    } else if (u) {
      alert("管理権限がありません。");
      signOut(auth);
    }
  });

  function buildAttendanceRow(e) {
    const tr = document.createElement('tr');
    const td1 = document.createElement('td'); td1.textContent = e.studentId || "";
    const td2 = document.createElement('td'); td2.textContent = e.name || "";
    const td3 = document.createElement('td');
    td3.textContent = e.timestamp ? new Date(e.timestamp).toLocaleTimeString() : "";
    tr.appendChild(td1); tr.appendChild(td2); tr.appendChild(td3);
    return tr;
  }

  function buildQuestionCard(key, q) {
    const content = q.body || q.text || "(内容なし)";
    const isRead = (q.read !== undefined) ? q.read : (q.answered || false);

    const card = document.createElement('div');
    card.id = `q-${key}`;
    card.className = `question-card ${isRead ? 'answered' : ''}`;

    const header = document.createElement('div');
    header.className = 'q-header';

    const small = document.createElement('small');
    const sid = q.studentId ? String(q.studentId).toUpperCase() : "";
    const name = q.name || "";
    small.textContent = (sid && name) ? `${sid} ${name}` : (q.email || "");
    header.appendChild(small);

    const toggleBtn = document.createElement('button');
    toggleBtn.className = `q-toggle ${isRead ? 'read' : 'unread'}`;
    toggleBtn.textContent = isRead ? '済' : '未';
    toggleBtn.onclick = () => window.toggleQ(key, !isRead);
    header.appendChild(toggleBtn);

    const body = document.createElement('div');
    body.className = 'q-body';
    body.textContent = content;

    card.appendChild(header);
    card.appendChild(body);
    return card;
  }

  function startMonitoring(sid) {
    const attBody = document.getElementById('att-list-body');
    const qCont = document.getElementById('questions-container');

    onValue(ref(db, `attendance/${sid}`), (s) => {
      const d = s.val() || {};
      const list = Object.values(d).sort((a, b) => (a.studentId || "").localeCompare(b.studentId || ""));
      document.getElementById('att-count').textContent = list.length;
      attBody.replaceChildren();
      list.forEach(e => attBody.appendChild(buildAttendanceRow(e)));
    });

    onValue(ref(db, `questions/${sid}`), (s) => {
      const d = s.val() || {};
      const keys = Object.keys(d).reverse();
      qCont.replaceChildren();
      if (keys.length === 0) {
        const empty = document.createElement('div');
        empty.textContent = "質問はありません。";
        qCont.appendChild(empty);
        return;
      }
      keys.forEach(k => qCont.appendChild(buildQuestionCard(k, d[k])));
    });
  }

  function buildSearchRow(r) {
    const tr = document.createElement('tr');
    const t1 = document.createElement('td'); t1.textContent = r.sid;
    const t2 = document.createElement('td'); t2.textContent = r.type;
    const t3 = document.createElement('td'); t3.textContent = r.person;
    const t4 = document.createElement('td'); t4.textContent = r.content;
    tr.appendChild(t1); tr.appendChild(t2); tr.appendChild(t3); tr.appendChild(t4);
    return tr;
  }

  document.getElementById('global-search-btn').onclick = async () => {
    const query = document.getElementById('global-search-input').value.toLowerCase().trim();
    if (!query) return;
    const btn = document.getElementById('global-search-btn');
    btn.textContent = "中..."; btn.disabled = true;
    try {
      const [as, qs] = await Promise.all([get(ref(db, 'attendance')), get(ref(db, 'questions'))]);
      const results = [];
      const ad = as.val() || {};
      const qd = qs.val() || {};
      Object.keys(ad).forEach(sid => Object.keys(ad[sid]).forEach(uid => {
        const a = ad[sid][uid];
        const comb = ((a.studentId || "") + (a.name || "") + (a.email || "")).toLowerCase();
        if (comb.includes(query)) results.push({ sid, type: "出席", person: `${a.studentId} / ${a.name || '-'}`, content: "---", time: a.timestamp });
      }));
      Object.keys(qd).forEach(sid => Object.keys(qd[sid]).forEach(qid => {
        const q = qd[sid][qid];
        const content = q.body || q.text || "";
        const comb = ((q.name || "") + (q.studentId || "") + (q.email || "") + content).toLowerCase();
        if (comb.includes(query)) results.push({ sid, type: "質問", person: q.name || q.email, content: content, time: q.timestamp });
      }));
      results.sort((a, b) => b.time - a.time);

      const body = document.getElementById('search-results-body');
      body.replaceChildren();
      if (results.length === 0) {
        const tr = document.createElement('tr');
        const td = document.createElement('td');
        td.colSpan = 4; td.textContent = "なし";
        tr.appendChild(td); body.appendChild(tr);
      } else {
        results.forEach(r => body.appendChild(buildSearchRow(r)));
      }
      document.getElementById('search-results-area').classList.remove('hidden');
    } catch (e) {
      console.error(e);
      alert("検索に失敗しました。");
    } finally {
      btn.textContent = "検索"; btn.disabled = false;
    }
  };

  document.getElementById('clear-search-btn').onclick = () => {
    document.getElementById('global-search-input').value = "";
    document.getElementById('search-results-area').classList.add('hidden');
  };

  window.toggleQ = (key, val) => update(ref(db, `questions/${viewingSessionId}/${key}`), { read: val });

  document.getElementById('start-lecture-btn').onclick = async () => {
    if (!viewingSessionId) return alert("回を選択してください。");
    const title = document.getElementById('current-display-label').textContent;
    if (!title || title === "科目を選択してください") {
      return alert("回を選択してから開始してください。");
    }
    const now = Date.now();
    await set(ref(db, 'active_session'), {
      id: viewingSessionId,
      title: title,
      isOpen: true,
      startedAt: now,
      expiresAt: now + LECTURE_DURATION_MS
    });
    alert(`講義を開始しました。\n（${LECTURE_DURATION_MS / 60000}分後に自動終了します）`);
  };

  document.getElementById('end-lecture-btn').onclick = async () => {
    if (confirm("講義を終了します。学生の画面を待機中に戻します。")) {
      await remove(ref(db, 'active_session'));
      location.reload();
    }
  };

  document.getElementById('export-csv-btn').onclick = async () => {
    const [attSnap, qSnap] = await Promise.all([
      get(ref(db, `attendance/${viewingSessionId}`)),
      get(ref(db, `questions/${viewingSessionId}`))
    ]);
    const attData = attSnap.val() || {};
    const qData = qSnap.val() || {};

    const qByUid = {};
    const qByStudentId = {};
    Object.values(qData).forEach(q => {
      const content = (q.body || q.text || "").trim();
      if (!content) return;
      if (q.uid) {
        if (!qByUid[q.uid]) qByUid[q.uid] = [];
        qByUid[q.uid].push(content);
      }
      if (q.studentId) {
        const sid = String(q.studentId).toUpperCase();
        if (!qByStudentId[sid]) qByStudentId[sid] = [];
        qByStudentId[sid].push(content);
      }
    });

    const list = Object.entries(attData)
      .map(([uid, e]) => ({ uid, ...e }))
      .sort((a, b) => (a.studentId || "").localeCompare(b.studentId || ""));

    const esc = (v) => {
      const s = String(v == null ? "" : v);
      return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
    };

    let csv = "\uFEFF学籍番号,氏名,出席時刻,質問内容\n";
    list.forEach(e => {
      const sid = e.studentId ? String(e.studentId).toUpperCase() : "";
      const questions = (qByUid[e.uid] && qByUid[e.uid].length)
        ? qByUid[e.uid]
        : (qByStudentId[sid] || []);
      const combined = questions.join(" / ");
      const timeStr = e.timestamp ? new Date(e.timestamp).toLocaleString() : "";
      csv += `${esc(e.studentId)},${esc(e.name)},${esc(timeStr)},${esc(combined)}\n`;
    });

    const blob = new Blob([csv], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${viewingSessionId}.csv`;
    a.click();
  };

  document.getElementById('delete-btn').onclick = async () => {
    if (confirm("この回のデータを完全に削除しますか？")) {
      await Promise.all([
        remove(ref(db, `attendance/${viewingSessionId}`)),
        remove(ref(db, `questions/${viewingSessionId}`))
      ]);
      if (viewingSessionId === activeSessionId) await remove(ref(db, 'active_session'));
      location.reload();
    }
  };

  document.getElementById('toggle-list-btn').onclick = () => document.getElementById('att-list-container').classList.toggle('hidden');
  document.getElementById('login-btn').onclick = () => signInWithPopup(auth, provider);
  document.getElementById('logout-btn').onclick = () => signOut(auth).then(() => location.reload());
</script>
</body>
</html>
